<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="372" viewBox="0 0 1280 372" role="img" aria-labelledby="title desc">
  <title id="title">Adnan Shuja | Lead AI Engineer and Solutions Architect</title>
  <desc id="desc">Premium midnight-navy profile banner with purple and emerald highlights, and a minimal AI orchestration network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1022"/><stop offset=".54" stop-color="#14132E"/><stop offset="1" stop-color="#081E25"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3A6FF"/><stop offset=".52" stop-color="#9B7BFF"/><stop offset="1" stop-color="#63E6B8"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#8F63FF" stop-opacity=".22"/><stop offset="1" stop-color="#8F63FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C3B7E4" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
    <style>
      .dash{animation:drift 15s linear infinite;transform-origin:1017px 190px}
      .pulse{animation:fade 4s ease-in-out infinite}
      @keyframes drift{to{transform:rotate(360deg)}}
      @keyframes fade{0%,100%{opacity:.2}50%{opacity:.65}}
      @media(prefers-reduced-motion:reduce){.dash,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="372" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="372" rx="22" fill="url(#grid)"/>
  <circle cx="1017" cy="190" r="285" fill="url(#halo)"/>
  <rect x="0" y="0" width="7" height="372" fill="url(#brand)"/>
  <rect x="57" y="45" width="286" height="30" rx="15" fill="#22213D" stroke="#655893" stroke-opacity=".75"/>
  <circle cx="76" cy="60" r="5" fill="#65E8B3"/>
  <text x="91" y="64.5" fill="#E1D7FC" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">AI PLATFORM ENGINEERING</text>
  <text x="57" y="159" fill="#F7F5FF" font-family="Arial,Helvetica,sans-serif" font-size="73" font-weight="800" letter-spacing="-2.5">Adnan Shuja</text>
  <text x="60" y="217" fill="url(#brand)" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="-.6">Architecting AI. Shipping products.</text>
  <text x="61" y="263" fill="#D5D0E8" font-family="Arial,Helvetica,sans-serif" font-size="20">Lead AI Engineer  /  Solutions Architect  /  Full-Stack Lead</text>
  <line x1="61" y1="293" x2="746" y2="293" stroke="#A18ADB" stroke-opacity=".24"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing=".5">
    <text x="61" y="323" fill="#CBB9FB">AGENTIC AI</text>
    <circle cx="177" cy="318" r="3" fill="#65E8B3"/>
    <text x="190" y="323" fill="#CBB9FB">RAG</text>
    <circle cx="235" cy="318" r="3" fill="#65E8B3"/>
    <text x="248" y="323" fill="#CBB9FB">FULL STACK</text>
    <circle cx="359" cy="318" r="3" fill="#65E8B3"/>
    <text x="372" y="323" fill="#CBB9FB">TECHNICAL LEADERSHIP</text>
  </g>
  <g transform="translate(15,0)">
    <circle cx="1002" cy="186" r="115" fill="none" stroke="#B496FF" stroke-opacity=".17" stroke-width="1.5"/>
    <circle class="dash" cx="1002" cy="186" r="145" fill="none" stroke="#B496FF" stroke-opacity=".33" stroke-dasharray="2 13" stroke-width="2"/>
    <g stroke-linecap="round" stroke-width="2" fill="none">
      <path d="M1002 186 L1001 69 M1002 186 L1121 124 M1002 186 L1130 251 M1002 186 L1000 305 M1002 186 L884 251 M1002 186 L876 128" stroke="#79DDC0" stroke-opacity=".5"/>
      <path d="M1001 69 L1121 124 L1130 251 L1000 305 L884 251 L876 128Z" stroke="#9878E8" stroke-opacity=".5"/>
    </g>
    <circle class="pulse" cx="1002" cy="186" r="39" fill="#6FEDD0" opacity=".18" filter="url(#glow)"/>
    <circle cx="1002" cy="186" r="30" fill="#153A41" stroke="#66E7B5" stroke-width="2.5"/>
    <circle cx="1002" cy="186" r="10" fill="#71F2C2"/>
    <g fill="#191D36" stroke="#AA91FF" stroke-width="2.5">
      <circle cx="1001" cy="69" r="17"/><circle cx="1121" cy="124" r="17"/>
      <circle cx="884" cy="251" r="17"/><circle cx="876" cy="128" r="17"/>
    </g>
    <g fill="#153A37" stroke="#65E8B3" stroke-width="2.5">
      <circle cx="1130" cy="251" r="17"/><circle cx="1000" cy="305" r="17"/>
    </g>
    <g fill="#C3B5FA"><circle cx="1001" cy="69" r="4"/><circle cx="1121" cy="124" r="4"/><circle cx="884" cy="251" r="4"/><circle cx="876" cy="128" r="4"/></g>
    <g fill="#75F3C4"><circle cx="1130" cy="251" r="4"/><circle cx="1000" cy="305" r="4"/></g>
  </g>
</svg>