<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
  <title id="title">Reference architecture: from product experience to governed AI actions</title>
  <desc id="desc">A conceptual AI platform pattern showing user experience, orchestration, workflow state, retrieval, tools, human review, and operational observability. This is not a proprietary system diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1225"/><stop offset="1" stop-color="#111E2D"/></linearGradient>
    <linearGradient id="feature" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B49CFF"/><stop offset="1" stop-color="#70F1C1"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#9FADCB" stroke-opacity=".045"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#86DEBF" stroke-width="1.5"/></marker>
    <style>
      .heading{font-family:Arial,Helvetica,sans-serif;font-weight:700}
      .body{font-family:Arial,Helvetica,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="485" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="485" rx="18" fill="url(#grid)"/>
  <text x="49" y="49" class="heading" font-size="16" fill="#83E9C0" letter-spacing="2.2">REFERENCE PATTERN  /  AI APPLICATION ARCHITECTURE</text>
  <text x="49" y="92" class="heading" font-size="32" fill="#F3F1FF">From user intent to governed action</text>
  <text x="49" y="117" class="body" font-size="15" fill="#BAC3D7">A conceptual design pattern — not a diagram of a private production system.</text>
  <!-- Top flow -->
  <rect x="48" y="151" width="250" height="91" rx="15" fill="#1C2640" stroke="#6F82AC" stroke-opacity=".7"/>
  <rect x="345" y="151" width="450" height="91" rx="15" fill="#252245" stroke="#AF90FD" stroke-width="1.8"/>
  <rect x="843" y="151" width="308" height="91" rx="15" fill="#1B3038" stroke="#6EE8B6" stroke-opacity=".9"/>
  <text x="70" y="178" class="heading" font-size="14" fill="#A8B8E8" letter-spacing="1.4">EXPERIENCE</text>
  <text x="70" y="207" class="heading" font-size="24" fill="#F4F7FF">Product interface</text>
  <text x="70" y="227" class="body" font-size="15" fill="#BDC6DD">React · Next.js · APIs</text>
  <text x="369" y="178" class="heading" font-size="14" fill="#C1ABFF" letter-spacing="1.4">INTELLIGENCE</text>
  <text x="369" y="207" class="heading" font-size="24" fill="#F4F7FF">Agent orchestration</text>
  <text x="369" y="227" class="body" font-size="15" fill="#D4CCEB">LangGraph · CrewAI · LLM workflows</text>
  <text x="865" y="178" class="heading" font-size="14" fill="#75EABC" letter-spacing="1.4">EXECUTION</text>
  <text x="865" y="207" class="heading" font-size="24" fill="#F4F7FF">Workflow authority</text>
  <text x="865" y="227" class="body" font-size="15" fill="#C4DDDA">State · permissions · policies</text>
  <path d="M300 196H340" stroke="#8BACC8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M797 196H837" stroke="#8BACC8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- fanout lines -->
  <path d="M570 243V264H202V287 M570 264V287 M570 264H991V287" fill="none" stroke="#86DEBF" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="570" cy="264" r="5" fill="#83E9C0"/>
  <circle cx="202" cy="287" r="4" fill="#9A7EE9"/>
  <circle cx="570" cy="287" r="4" fill="#9A7EE9"/>
  <circle cx="991" cy="287" r="4" fill="#9A7EE9"/>
  <!-- Bottom service cards -->
  <rect x="49" y="298" width="312" height="113" rx="14" fill="#1E2840" stroke="#566F98" stroke-opacity=".7"/>
  <rect x="391" y="298" width="343" height="113" rx="14" fill="#1E2840" stroke="#566F98" stroke-opacity=".7"/>
  <rect x="765" y="298" width="386" height="113" rx="14" fill="#1E2840" stroke="#566F98" stroke-opacity=".7"/>
  <rect x="49" y="298" width="6" height="113" rx="3" fill="#A994FF"/>
  <rect x="391" y="298" width="6" height="113" rx="3" fill="#A994FF"/>
  <rect x="765" y="298" width="6" height="113" rx="3" fill="#65E8B3"/>
  <text x="71" y="326" class="heading" font-size="14" fill="#AFA1F2" letter-spacing="1.2">01 / GROUNDING</text>
  <text x="71" y="357" class="heading" font-size="23" fill="#F4F7FF">Reliable retrieval</text>
  <text x="71" y="384" class="body" font-size="16" fill="#BDC7DA">RAG · Pinecone · Qdrant</text>
  <text x="413" y="326" class="heading" font-size="14" fill="#AFA1F2" letter-spacing="1.2">02 / CAPABILITIES</text>
  <text x="413" y="357" class="heading" font-size="23" fill="#F4F7FF">Tools &amp; integrations</text>
  <text x="413" y="384" class="body" font-size="16" fill="#BDC7DA">MCP · A2A · typed service APIs</text>
  <text x="787" y="326" class="heading" font-size="14" fill="#80E6BA" letter-spacing="1.2">03 / OVERSIGHT</text>
  <text x="787" y="357" class="heading" font-size="23" fill="#F4F7FF">Human review &amp; safety</text>
  <text x="787" y="384" class="body" font-size="16" fill="#BDC7DA">HITL approvals · audit trails</text>
  <!-- foundation -->
  <rect x="48" y="437" width="1103" height="31" rx="10" fill="#162C36" stroke="#3E6C6B" stroke-opacity=".6"/>
  <circle cx="71" cy="452" r="5" fill="#70EAB9"/>
  <text x="86" y="457" class="heading" font-size="15" fill="#C4EBDD">FOUNDATION</text>
  <text x="219" y="457" class="body" font-size="15" fill="#C0CEDB">Observability · Evaluations · Automated delivery · Operational security</text>
</svg>